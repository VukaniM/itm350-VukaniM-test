name: Test Login Endpoint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js
      uses: actions/setup-node@v2
      with:
        node-version: 14.x
    - name: Install dependencies
      run: |
        cd api-tests
        npm ci
    - name: Run API tests
      run: |
        cd api-tests
        npm test
    - name: Generate coverage report
      run: |
        cd api-tests
        npm run coverage
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v1
      with:
        files: ./api-tests/coverage.xml
        env_vars: OS,NODE_VERSION
        fail_ci_if_error: true
